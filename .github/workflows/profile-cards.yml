name: Profile cards

# Rebuilds every image the README shows, stamps their links, commits them, then
# checks the live profile. A failed build changes nothing: the README keeps the
# last good files. A failed check fails the run, and GitHub emails the owner.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'README.md', '.github/workflows/profile-cards.yml']

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build images
        env:
          # PROFILE_TOKEN (a classic token with read:user) also counts private contributions; without it,
          # the workflow's own token counts public ones.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node scripts/build-brand.mjs
          node scripts/build-journey.mjs
          node scripts/build-stack.mjs
          node scripts/build-cards.mjs
          node scripts/stamp-readme.mjs
      - name: Commit changes
        run: |
          if git diff --quiet -- assets README.md && [ -z "$(git ls-files --others --exclude-standard assets)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git commit -m "chore: refresh profile cards"
          git push

  verify:
    needs: cards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every image on the live profile loads
        run: node scripts/verify-profile.mjs
