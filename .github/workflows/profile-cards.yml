name: Profile cards

# Rebuilds the banner, stack and activity images from GitHub's API and commits them.
# A failed run changes nothing: the README keeps showing the last good files.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/profile-cards.yml']

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build cards
        env:
          # PROFILE_TOKEN (a classic token with read:user) also counts private contributions; without it,
          # the workflow's own token counts public ones.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node scripts/build-brand.mjs
          node scripts/build-stack.mjs
          node scripts/build-cards.mjs
      - name: Commit changes
        run: |
          if git diff --quiet -- assets; then
            echo "Cards unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh profile cards"
          git push
